name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate bank files against schema
        run: npm run validate
      - name: Test retrieval, MCP protocol, and bank quality
        run: npm test
      - name: Bank stats
        run: npm run stats
